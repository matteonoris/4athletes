plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseSigningProperties = new Properties()
def releaseSigningFile = rootProject.file("key.properties")
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
}
def requiredSigningKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def missingSigningKeys = requiredSigningKeys.findAll { !releaseSigningProperties[it] }
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
if (releaseRequested && (!releaseSigningFile.exists() || !missingSigningKeys.isEmpty())) {
    throw new GradleException("Android release signing is not configured. Add android/key.properties with storeFile, storePassword, keyAlias and keyPassword.")
}
if (releaseRequested && !rootProject.file(releaseSigningProperties["storeFile"]).isFile()) {
    throw new GradleException("Android release keystore file does not exist: check storeFile in android/key.properties.")
}

android {
    namespace = "com.matteonoris.app4athletes"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    defaultConfig {
        applicationId = "com.matteonoris.app4athletes"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (missingSigningKeys.isEmpty()) {
                storeFile = rootProject.file(releaseSigningProperties["storeFile"])
                storePassword = releaseSigningProperties["storePassword"]
                keyAlias = releaseSigningProperties["keyAlias"]
                keyPassword = releaseSigningProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

configurations.all {
    resolutionStrategy {
        force "androidx.core:core:1.13.1"
        force "androidx.core:core-ktx:1.13.1"
        force "androidx.browser:browser:1.8.0"
    }
}

dependencies {
    implementation "com.google.mlkit:text-recognition:16.0.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    implementation "androidx.health.connect:connect-client:1.1.0-alpha07"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1"
}

